<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloqueo de Tiempo - Estudia con tus amigos 🌷</title>
<style>
  body { background: #FFF0F5; font-family: Arial, sans-serif; color: #555; margin: 0; padding: 10px; }
  .contenedor { max-width: 420px; margin: 0 auto; }
  .tarjeta { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; text-align: center; }
  h1, h2 { color: #745A9E; margin: 8px 0; }
  button { border: none; border-radius: 20px; padding: 9px 14px; margin: 3px; background: #DCC9FF; color: #745A9E; font-weight: bold; cursor: pointer; transition: transform 0.15s; }
  button:hover { transform: scale(1.07); }
  button:active { transform: scale(0.93); }
  .azul { background: #CFE8FF; }
  .amarillo { background: #FFE9A8; }
  .rosa { background: #FFD6E5; }
  .oculto { display: none; }
  .activo { outline: 3px solid #745A9E; }
  .stats { font-size: 12px; font-weight: bold; color: #745A9E; }
  .reloj { background: #DCC9FF; border-radius: 15px; padding: 12px; margin: 10px 0; }
  #reloj_texto { font-size: 46px; font-weight: bold; color: #745A9E; }
  #barra_fondo { height: 10px; background: #fff; border-radius: 10px; margin-top: 8px; overflow: hidden; }
  #barra { height: 100%; width: 0; background: #745A9E; transition: width 1s linear; }
  #personaje_card { font-size: 56px; cursor: pointer; display: inline-block; }
  #personaje_card.salta { animation: salto 0.6s; }
  #personaje_card.estudia { animation: flota 1.5s ease-in-out infinite; }
  @keyframes salto { 40% { transform: scale(1.4) rotate(10deg); } }
  @keyframes flota { 50% { transform: translateY(-8px); } }
  .burbuja { background: #FFD6E5; border-radius: 15px; padding: 10px; margin-top: 10px; font-weight: bold; }
  input[type=text], select { padding: 8px; border-radius: 12px; border: 2px solid #DCC9FF; font-size: 14px; }
  .tarea { display: flex; align-items: center; gap: 8px; background: #FFF0F5; border-radius: 12px; padding: 6px 10px; margin-top: 6px; text-align: left; }
  .tarea span { flex: 1; }
  .tarea.hecha span { text-decoration: line-through; opacity: 0.5; }
  .tarea.actual { background: #FFD6E5; }
  .amigos { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .amigo { background: #FFF0F5; border-radius: 12px; padding: 8px; font-size: 12px; width: 80px; }
  .amigo b { display: block; font-size: 28px; }
  .petalo { position: fixed; top: -30px; z-index: 9; pointer-events: none; animation: cae linear forwards; }
  @keyframes cae { to { transform: translateY(110vh) rotate(500deg); } }
  .fondo_modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 20; }
</style>
</head>
<body>
<div class="contenedor">

  <!-- ===== PANTALLA DE INICIO ===== -->
  <div id="pantalla_inicio" class="tarjeta">
    <h1>🌷 BLOQUEO DE TIEMPO 🌷</h1>
    <p>¿Cómo te sientes hoy? ✨</p>
    <button class="amarillo" onclick="elegir_animo('feliz', this)">😊 Feliz</button>
    <button class="azul" onclick="elegir_animo('cansada', this)">😴 Cansada/o</button>
    <button class="rosa" onclick="elegir_animo('motivada', this)">🔥 Motivada/o</button>
    <div class="burbuja" id="mensaje_animo">Elige tu ánimo y ajusto tu sesión ✨</div>
    <p style="font-size:36px">🌸 🎀 🌸</p>
    <button class="azul" onclick="ir_a_estudio()">▶ Entrar a la Sala de Estudio</button>
  </div>

  <!-- ===== PANTALLA DE ESTUDIO ===== -->
  <div id="pantalla_estudio" class="oculto">
    <div class="tarjeta">
      <button onclick="ir_a_inicio()">← Inicio</button>
      <div class="stats" id="stats_texto"></div>
      <h2 id="titulo_estado">📚 Tiempo de estudio</h2>
      <div class="reloj">
        <div id="reloj_texto">25:00</div>
        <div id="barra_fondo"><div id="barra"></div></div>
      </div>
      <button class="azul" onclick="btn_iniciar()">▶ Iniciar</button>
      <button class="amarillo" onclick="btn_pausar()">⏸ Pausar</button>
      <button onclick="btn_reiniciar()">↻ Reiniciar</button>
      <br>
      <button id="m15" onclick="cambiar_modo(15, 3)">15m</button>
      <button id="m25" class="activo" onclick="cambiar_modo(25, 5)">25m</button>
      <button id="m50" onclick="cambiar_modo(50, 10)">50m</button>
    </div>

    <div class="tarjeta">
      <div id="personaje_card" class="estudia" onclick="mostrar_frase()">🐶</div>
      <div id="nombre_personaje" style="font-weight:bold">Pochacco</div>
      <select id="dropdown_personajes" onchange="cambiar_personaje()"></select>
      <button onclick="mostrar_frase()">💌 Frase</button>
      <div class="burbuja" id="burbuja_frase">Toca a tu personaje para recibir ánimo 💕</div>
    </div>

    <div class="tarjeta">
      <h2>📝 BLOQUES / TAREAS</h2>
      <input type="text" id="entrada_tarea" placeholder="Bloque / Tarea..." maxlength="50">
      <button onclick="agregar_tarea()">+ Agregar</button>
      <div id="tareas_columna"></div>
      <div class="stats" id="progreso_tareas"></div>
    </div>

    <div class="tarjeta">
      <h2>👯 Sala de estudio</h2>
      <div style="font-size:12px">Amigos de compañía (simulados) 🌷</div>
      <div class="amigos" id="amigos"></div>
    </div>
  </div>
</div>

<script>
// ===== VARIABLES (igual que en la versión de Python) =====
let duracion_estudio = 25 * 60;
let duracion_descanso = 5 * 60;
let segundos = 25 * 60;
let corriendo = false;
let en_descanso = false;
let pomodoros = 0;
let minutos_totales = 0;
let intervalo = null;
let personaje_actual = "Pochacco";
let tareas = [];
let tarea_actual = null;

const personajes = {
  "Pochacco": "🐶",
  "Pompompurin": "🍮",
  "Hello Kitty": "🎀",
  "My Melody": "🐰",
  "Kuromi": "💜"
};

const frases = [
  "¡Lo estás haciendo genial! 💖",
  "Paso a paso lograrás todas tus metas ✨",
  "Confía en ti y en tu proceso 🌸",
  "¡Tu esfuerzo valdrá totalmente la pena! 🌟",
  "Tómate tu tiempo, no hay prisa 🌷"
];

// cada ánimo cambia el modo de estudio y el personaje
const animos = {
  feliz:    { estudio: 25, descanso: 5,  personaje: "Pompompurin", mensaje: "¡Qué lindo! Aprovecha con bloques de 25 min 🌼" },
  cansada:  { estudio: 15, descanso: 3,  personaje: "My Melody",   mensaje: "Vamos suave: bloques cortos de 15 min 💧" },
  motivada: { estudio: 50, descanso: 10, personaje: "Kuromi",      mensaje: "¡A romperla! Bloques largos de 50 min 🔥" }
};

const amigos = [
  { nombre: "Sofi", emoji: "🦊", minutos: 12 },
  { nombre: "Dani", emoji: "🐻", minutos: 7 },
  { nombre: "Luna", emoji: "🐱", minutos: 20 }
];

// atajo para buscar elementos
const $ = (id) => document.getElementById(id);

// ===== RELOJ =====
function actualizar_reloj() {
  let mins = Math.floor(segundos / 60);
  let segs = segundos % 60;
  let texto = String(mins).padStart(2, "0") + ":" + String(segs).padStart(2, "0");
  $("reloj_texto").textContent = texto;
  let total = en_descanso ? duracion_descanso : duracion_estudio;
  $("barra").style.width = ((total - segundos) / total * 100) + "%";
  document.title = texto + " 🌷 Bloqueo de Tiempo";
  $("stats_texto").textContent = "🏆 Bloques: " + pomodoros + " | ⏱️ Enfoque: " + minutos_totales + " min";
  $("personaje_card").textContent = en_descanso ? "😴" : personajes[personaje_actual];
  $("personaje_card").className = (corriendo && !en_descanso) ? "estudia" : "";
}

function temporizador_loop() {
  if (segundos > 0) {
    segundos--;
    actualizar_reloj();
  } else {
    clearInterval(intervalo);
    corriendo = false;
    lluvia_petalos();
    sonar();
    if (!en_descanso) {
      en_descanso = true;
      segundos = duracion_descanso;
      pomodoros++;
      minutos_totales += duracion_estudio / 60;
      if (tarea_actual) { tarea_actual.pomodoros++; mostrar_tareas(); }
      $("titulo_estado").textContent = "🌼 ¡Hora del descanso!";
      actualizar_reloj();
      abrir_modal("🔒 MODO CONCENTRACIÓN", personajes[personaje_actual] + " " + personaje_actual + " te felicita!\nToma agua y estira el cuerpo 🌸");
      btn_iniciar();
    } else {
      en_descanso = false;
      segundos = duracion_estudio;
      $("titulo_estado").textContent = "📚 ¡A estudiar nuevamente!";
      actualizar_reloj();
    }
  }
}

function btn_iniciar() {
  if (!corriendo) {
    corriendo = true;
    intervalo = setInterval(temporizador_loop, 1000);
    actualizar_reloj();
  }
}

function btn_pausar() {
  corriendo = false;
  clearInterval(intervalo);
  actualizar_reloj();
}

function btn_reiniciar() {
  btn_pausar();
  en_descanso = false;
  segundos = duracion_estudio;
  $("titulo_estado").textContent = "📚 Tiempo de estudio";
  actualizar_reloj();
}

function cambiar_modo(m_estudio, m_descanso) {
  duracion_estudio = m_estudio * 60;
  duracion_descanso = m_descanso * 60;
  ["m15", "m25", "m50"].forEach(id => $(id).classList.remove("activo"));
  $("m" + m_estudio).classList.add("activo");
  btn_reiniciar();
}

// ===== MODAL, FRASES Y EFECTOS =====
function abrir_modal(titulo, texto) {
  let fondo = document.createElement("div");
  fondo.className = "fondo_modal";
  fondo.innerHTML = '<div class="tarjeta" style="max-width:300px"><h2></h2><p style="white-space:pre-line"></p><button class="azul">Cerrar</button></div>';
  fondo.querySelector("h2").textContent = titulo;
  fondo.querySelector("p").textContent = texto;
  fondo.querySelector("button").onclick = () => fondo.remove();
  document.body.appendChild(fondo);
}

function mostrar_frase() {
  let frase = frases[Math.floor(Math.random() * frases.length)];
  $("burbuja_frase").textContent = "Mensaje de " + personaje_actual + " 💕: " + frase;
  let p = $("personaje_card");
  p.classList.remove("salta");
  void p.offsetWidth; // reinicia la animación
  p.classList.add("salta");
}

function lluvia_petalos() {
  let adornos = ["🌸", "🌷", "🎀", "✨", "💖"];
  for (let i = 0; i < 25; i++) {
    let petalo = document.createElement("div");
    petalo.className = "petalo";
    petalo.textContent = adornos[i % adornos.length];
    petalo.style.left = Math.random() * 100 + "vw";
    petalo.style.fontSize = (14 + Math.random() * 16) + "px";
    petalo.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(petalo);
    setTimeout(() => petalo.remove(), 6500);
  }
}

function sonar() {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 1100].forEach((f, i) => {
      let osc = ctx.createOscillator();
      let vol = ctx.createGain();
      osc.frequency.value = f;
      osc.connect(vol);
      vol.connect(ctx.destination);
      vol.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.18);
      vol.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.3);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.3);
    });
  } catch (e) {}
}

// ===== PERSONAJES =====
for (let nombre in personajes) {
  let op = document.createElement("option");
  op.value = nombre;
  op.textContent = personajes[nombre] + " " + nombre;
  $("dropdown_personajes").appendChild(op);
}

function cambiar_personaje() {
  personaje_actual = $("dropdown_personajes").value;
  $("nombre_personaje").textContent = personaje_actual;
  actualizar_reloj();
  mostrar_frase();
}

// ===== TAREAS =====
function agregar_tarea() {
  let texto = $("entrada_tarea").value.trim();
  if (texto) {
    tareas.push({ texto: texto, hecha: false, pomodoros: 0 });
    $("entrada_tarea").value = "";
    mostrar_tareas();
  }
}
$("entrada_tarea").addEventListener("keydown", e => { if (e.key === "Enter") agregar_tarea(); });

function mostrar_tareas() {
  let columna = $("tareas_columna");
  columna.innerHTML = "";
  tareas.forEach((t) => {
    let fila = document.createElement("div");
    fila.className = "tarea" + (t.hecha ? " hecha" : "") + (t === tarea_actual ? " actual" : "");
    let chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = t.hecha;
    chk.onchange = () => {
      t.hecha = chk.checked;
      if (t.hecha) lluvia_petalos();
      mostrar_tareas();
    };
    let texto = document.createElement("span");
    texto.textContent = t.texto + (t.pomodoros ? " 🍅x" + t.pomodoros : "");
    let enfoque = document.createElement("button");
    enfoque.textContent = "🎯";
    enfoque.onclick = () => { tarea_actual = (tarea_actual === t) ? null : t; mostrar_tareas(); };
    let borrar = document.createElement("button");
    borrar.textContent = "✕";
    borrar.onclick = () => { tareas = tareas.filter(x => x !== t); if (tarea_actual === t) tarea_actual = null; mostrar_tareas(); };
    fila.append(chk, texto, enfoque, borrar);
    columna.appendChild(fila);
  });
  let listas = tareas.filter(t => t.hecha).length;
  $("progreso_tareas").textContent = tareas.length ? listas + " de " + tareas.length + " completadas" : "";
}

// ===== AMIGOS SIMULADOS =====
function mostrar_amigos() {
  $("amigos").innerHTML = amigos.map(a =>
    '<div class="amigo"><b>' + a.emoji + '</b>' + a.nombre + '<br>' + a.minutos + ' min</div>'
  ).join("");
}
setInterval(() => {
  if (corriendo && !en_descanso) {
    amigos.forEach(a => a.minutos++);
    mostrar_amigos();
  }
}, 60000);

// ===== NAVEGACIÓN =====
function elegir_animo(animo, boton) {
  let a = animos[animo];
  $("mensaje_animo").textContent = a.mensaje;
  personaje_actual = a.personaje;
  $("dropdown_personajes").value = a.personaje;
  $("nombre_personaje").textContent = a.personaje;
  cambiar_modo(a.estudio, a.descanso);
  lluvia_petalos();
}

function ir_a_estudio() {
  $("pantalla_inicio").classList.add("oculto");
  $("pantalla_estudio").classList.remove("oculto");
  actualizar_reloj();
  mostrar_amigos();
}

function ir_a_inicio() {
  btn_pausar();
  $("pantalla_estudio").classList.add("oculto");
  $("pantalla_inicio").classList.remove("oculto");
}
</script>
</body>
</html>
